  { stat:'SIGNAL',  tier:1, name:'The Spotter',     req:30, status:'locked',     desc:'Three weekly outreach targets with reason \u2014 names not categories.' },
  { stat:'SIGNAL',  tier:2, name:'The Drafter',     req:50, status:'locked',     desc:'Personalised outreach message drafted per Spotter target.' },
  { stat:'SIGNAL',  tier:3, name:'\u2014',          req:70, status:'locked',     desc:'Reserved.' },
  { stat:'SIGNAL',  tier:4, name:'\u2014',          req:90, status:'locked',     desc:'Reserved.' },
  // ART
  { stat:'ART',     tier:1, name:'\u2014',          req:30, status:'locked',     desc:'Reserved.' },
  { stat:'ART',     tier:2, name:'The Set',         req:50, status:'locked',     desc:'Monthly DJ set structure with transition cues.' },
  { stat:'ART',     tier:3, name:'\u2014',          req:70, status:'locked',     desc:'Reserved.' },
  { stat:'ART',     tier:4, name:'\u2014',          req:90, status:'locked',     desc:'Reserved.' },
];

const INITIAL_STATE = {
  player: { name: 'ONE', level: 4, totalXP: 1820, xpToNext: 675, day: 14, streak: 6, bestStreak: 11 },
  stats: { CRAFT: 32, BUILDER: 24, CAPITAL: 18, BODY: 28, MIND: 22, SIGNAL: 11, ART: 8 },
  decay: { CRAFT: 1, BUILDER: 0, CAPITAL: 4, BODY: 0, MIND: 2, SIGNAL: 13, ART: 21 },
  energy: 3,
  quests: SEED_QUESTS,
  pillars: SEED_PILLARS,
  arc: SEED_ARC,
  gt: SEED_GT,
  week: SEED_WEEK,
  passives: SEED_PASSIVES,
  financial: SEED_FINANCIAL,
  penalties: SEED_PENALTIES,
  pastWeeks: SEED_PAST_WEEKS,
  questLog: SEED_QUEST_LOG,
  library: SEED_LIBRARY,
  skills: SEED_SKILLS,
  // Yesterday — referenced by the "pre-checkin" banner
  yesterday: { complete: 2, failed: 1, penalty: 0 },
};

// ── Context ─────────────────────────────────────────────────────────────────

const AppCtx = createContext(null);

function AppProvider({ children, dayState, voice, theme, density, setDayState }) {
  const [data, setData] = useState(INITIAL_STATE);
  // route: which top-level tab is active; subroute: in-tab navigation
  const [route, setRoute] = useState({ tab: 'directive', sub: null, params: {} });
  // overlay: full-screen flows (morning, evening, proof, sunday, fail-confirm)
  const [overlay, setOverlay] = useState(null);
  const [flash, setFlash] = useState(null); // 'invert' | 'stamp' | null

  // Mirror dayState into quest states for visual demo.
  useEffect(() => {
    setData(d => {
      if (dayState === 'pre-checkin') {
        return { ...d, quests: d.quests.map(q => ({ ...q, state: 'open' })) };
      }
      if (dayState === 'mid-day') {
        return { ...d, quests: d.quests.map((q,i) => ({ ...q, state: i === 0 ? 'complete' : 'open' })) };
      }
      if (dayState === 'all-complete') {
        return { ...d, quests: d.quests.map(q => ({ ...q, state: q.isBonus ? 'open' : 'complete' })) };
      }
      if (dayState === 'failed') {
        return { ...d, quests: d.quests.map((q,i) => ({ ...q, state: i === 0 ? 'complete' : i === 2 ? 'failed' : 'open' })) };
      }
      return d;
    });
  }, [dayState]);

  // Actions ───────────────────────────────────────────────────────────────────
  const completeQuest = useCallback((id) => {
    setData(d => ({ ...d, quests: d.quests.map(q => q.id === id ? { ...q, state: 'complete' } : q) }));
  }, []);

  const failQuest = useCallback((id) => {
    setFlash('invert');
    setTimeout(() => setFlash(null), 1200);
    setData(d => ({ ...d, quests: d.quests.map(q => q.id === id ? { ...q, state: 'failed' } : q) }));
  }, []);

  const value = useMemo(() => ({
    data, setData,
    route, setRoute,
    overlay, setOverlay,
    flash, setFlash,
    completeQuest, failQuest,
    dayState, setDayState,
    voice: VOICE[voice] || VOICE.cold,
    theme: THEMES[theme] || THEMES.vellum,
    density: DENSITY[density] || DENSITY.comfortable,
    themeKey: theme,
    voiceKey: voice,
    densityKey: density,
  }), [data, route, overlay, flash, dayState, voice, theme, density, completeQuest, failQuest, setDayState]);

  return <AppCtx.Provider value={value}>{children}</AppCtx.Provider>;
}

const useApp = () => useContext(AppCtx);

Object.assign(window, { AppProvider, AppCtx, useApp, STATS, STAT_DESC });
</script>

<!-- primitives.jsx -->
<script type="text/babel">
// primitives.jsx — Shared UI primitives for LifeOS.
// Disciplined, ledger-coded. Cards have rules, not rounded corners.

const { useState: useS, useEffect: useE, useMemo: useM, useRef: useR } = React;

// ── Small atoms ─────────────────────────────────────────────────────────────

function Rule({ kind = 'solid', color, style }) {
  const { theme } = useApp();
  const c = color || theme.rule;
  if (kind === 'dash') return <div style={{ color: c, ...style }} className="ls-rule-dash" />;
  if (kind === 'double') return <div style={{ color: c, ...style }} className="ls-rule-double" />;
  return <div style={{ height: 1, background: c, width: '100%', ...style }} />;
}

function Mono({ children, style, dim, size, bold }) {
  const { theme } = useApp();
  return <span className="ls-mono" style={{
    color: dim ? theme.inkDim : 'inherit',
    fontSize: size,
    fontWeight: bold ? 600 : 400,
    letterSpacing: '0.01em',
    ...style,
  }}>{children}</span>;
}

function Meta({ children, style }) {
  const { theme, density } = useApp();
  return <div className="ls-mono" style={{
    fontSize: density.fontMeta,
    letterSpacing: '0.14em',
    textTransform: 'uppercase',
    color: theme.inkMute,
    ...style,
  }}>{children}</div>;
}

function Pill({ children, color, bg, border, style }) {
  const { theme } = useApp();
  return <span className="ls-mono" style={{
    display: 'inline-flex', alignItems: 'center', gap: 6,
    fontSize: 10, letterSpacing: '0.12em', textTransform: 'uppercase',
    padding: '3px 8px',
    border: `1px solid ${border || theme.rule}`,
    color: color || theme.inkDim,
    background: bg || 'transparent',
    borderRadius: 2,
    ...style,
  }}>{children}</span>;
}

// Procedural button. Sharp corners. Two variants: 'primary' (filled accent),
// 'ghost' (outline only). No drop shadows, no hover lifts.
function Btn({ children, onClick, variant = 'ghost', danger, full, size = 'md', disabled, style }) {
  const { theme } = useApp();
  const isPrimary = variant === 'primary';
  const color = danger ? theme.danger : (isPrimary ? theme.bg : theme.ink);
  const bg = isPrimary ? (danger ? theme.danger : theme.ink) : 'transparent';
  const border = isPrimary ? bg : (danger ? theme.danger : theme.rule);
  const pad = size === 'sm' ? '6px 12px' : size === 'lg' ? '14px 22px' : '10px 16px';
  return <button
    className="ls-press ls-mono"
    onClick={onClick}
    disabled={disabled}
    style={{
      appearance: 'none', border: `1px solid ${border}`, background: bg, color,
      padding: pad, letterSpacing: '0.16em', fontSize: 11, fontWeight: 500,
      textTransform: 'uppercase', width: full ? '100%' : 'auto',
      borderRadius: 0, ...style,
    }}>
    {children}
  </button>;
}

// A pressable list-row chevron control.
function RowLink({ children, right, onClick, style }) {
  const { theme, density } = useApp();
  return <button onClick={onClick} className="ls-press" style={{
    appearance: 'none', border: 'none', background: 'transparent', color: 'inherit',
    display: 'flex', alignItems: 'center', justifyContent: 'space-between', gap: 12,
    padding: `${density.padCard - 4}px 0`,
    borderBottom: `1px solid ${theme.rule2}`,
    width: '100%', textAlign: 'left',
    fontSize: density.fontBody,
    ...style,
  }}>
    <span style={{ flex: 1 }}>{children}</span>
    <span style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
      {right && <span style={{ color: theme.inkDim }}>{right}</span>}
      <span style={{ color: theme.inkMute, fontFamily: 'JetBrains Mono, monospace' }}>›</span>
    </span>
  </button>;
}

// ── Card ────────────────────────────────────────────────────────────────────
// A "card" here means: optional top label rule, flush content, dim bottom rule.
// No rounded corners. The whole UI is paper grid.

function Card({ label, meta, children, style, accent, dense, onClick }) {
  const { theme, density } = useApp();
  return <div
    onClick={onClick}
    style={{
      borderTop: `1px solid ${accent || theme.rule}`,
      paddingTop: 10,
      paddingBottom: density.padCard,
      cursor: onClick ? 'pointer' : 'default',
      ...style,
    }}>
    {(label || meta) && (
      <div style={{
        display: 'flex', alignItems: 'baseline', justifyContent: 'space-between',
        marginBottom: dense ? 6 : 10,
      }}>
        {label && <Meta>{label}</Meta>}
        {meta && <Meta style={{ letterSpacing: '0.06em' }}>{meta}</Meta>}
      </div>
    )}
    {children}
  </div>;
}

// ── Page header ────────────────────────────────────────────────────────────
function PageHeader({ overline, title, meta, right, style }) {
  const { theme, density } = useApp();
  return <div style={{
    paddingTop: 18, paddingBottom: 18, borderBottom: `1px solid ${theme.rule}`,
    display: 'flex', alignItems: 'flex-end', justifyContent: 'space-between', gap: 16,
    ...style,
  }}>
    <div style={{ minWidth: 0 }}>
      {overline && <Meta style={{ marginBottom: 6 }}>{overline}</Meta>}
      <h1 style={{ fontSize: density.fontHead, fontWeight: 500, color: theme.ink, letterSpacing: '-0.01em' }}>{title}</h1>
      {meta && <div style={{ marginTop: 4 }}><Meta>{meta}</Meta></div>}
    </div>
    {right && <div style={{ flexShrink: 0 }}>{right}</div>}
  </div>;
}

// ── Stat bar ────────────────────────────────────────────────────────────────
// Hand-drawn (CSS) tick-marked progress bar. No round caps.
function StatBar({ stat, value, max = 100, ticks = 10, height = 10, showLabel = true, decay }) {
  const { theme, density } = useApp();
  const color = theme.stat[stat] || theme.accent;
  const pct = Math.max(0, Math.min(100, (value / max) * 100));
  return <div>
    {showLabel && (
      <div style={{ display: 'flex', alignItems: 'baseline', justifyContent: 'space-between', marginBottom: 4 }}>
        <Meta style={{ color: color }}>{stat}</Meta>
        <span className="ls-num" style={{ color: theme.ink, fontSize: density.fontBody, fontWeight: 500 }}>
          {String(value).padStart(2, '0')}<span style={{ color: theme.inkFaint }}>/100</span>
          {decay !== undefined && decay >= 10 && (
            <span className="ls-mono" style={{
              fontSize: 9.5, color: decay >= 14 ? theme.danger : theme.warn,
              marginLeft: 8, letterSpacing: '0.1em',
            }}>{decay}D DORMANT</span>
          )}
        </span>
      </div>
    )}
    <div style={{ position: 'relative', height, background: theme.rule2 }}>
      <div style={{
        position: 'absolute', top: 0, left: 0, bottom: 0,
        width: `${pct}%`, background: color, opacity: 0.85,
      }} />
      {/* tick marks */}
      <div style={{ position: 'absolute', inset: 0, display: 'flex' }}>
        {Array.from({ length: ticks - 1 }).map((_, i) => (
          <div key={i} style={{
            flex: 1, borderRight: `1px solid ${theme.bg}`, opacity: 0.45,
          }} />
        ))}
      </div>
    </div>
  </div>;
}

// ── Stamp ───────────────────────────────────────────────────────────────────
// Rubber-stamp graphic, drops onto things. Used on completed/failed cards
// and on day-close.
function Stamp({ text, color, sub, angle = -4, size = 'md', style, animate }) {
  const { theme } = useApp();
  const c = color || theme.stamp;
  const isLg = size === 'lg';
  return <div
    className={animate ? 'ls-stamp-anim' : ''}
    style={{
      display: 'inline-flex', flexDirection: 'column', alignItems: 'center',
      padding: isLg ? '12px 22px' : '7px 14px',
      border: `${isLg ? 2.5 : 2}px solid ${c}`,
      color: c,
      transform: `rotate(${angle}deg)`,
      letterSpacing: isLg ? '0.18em' : '0.16em',
      fontFamily: 'JetBrains Mono, monospace',
      fontSize: isLg ? 22 : 13,
      fontWeight: 600,
      textTransform: 'uppercase',
      borderRadius: 2,
      // Slight ink-bleed effect with double border
      boxShadow: `inset 0 0 0 1px ${c}, 0 0 0 1px ${theme.bg}, 0 0 0 ${isLg ? 3 : 2}px ${c}`,
      background: 'transparent',
      ...style,
    }}>
    <span>{text}</span>
    {sub && <span style={{ fontSize: isLg ? 9 : 8, opacity: 0.85, letterSpacing: '0.18em', marginTop: 2 }}>{sub}</span>}
  </div>;
}

// ── Pillar progress ring ────────────────────────────────────────────────────
function Ring({ value, max = 100, size = 80, color, label, sub }) {
  const { theme } = useApp();
  const stroke = 1.5;
  const r = (size / 2) - stroke - 2;
  const circ = 2 * Math.PI * r;
  const pct = Math.max(0, Math.min(1, value / max));
  return <div style={{ display: 'inline-flex', flexDirection: 'column', alignItems: 'center', gap: 6 }}>
    <svg width={size} height={size} style={{ display: 'block' }}>
      <circle cx={size/2} cy={size/2} r={r} stroke={theme.rule} strokeWidth={stroke} fill="none" />
      <circle
        cx={size/2} cy={size/2} r={r}
        stroke={color || theme.accent} strokeWidth={stroke + 0.5} fill="none"
        strokeDasharray={`${pct * circ} ${circ}`}
        transform={`rotate(-90 ${size/2} ${size/2})`} />
      {/* notches at quarters */}
      {[0,90,180,270].map(d => {
        const a = (d - 90) * Math.PI / 180;
        const x1 = size/2 + Math.cos(a) * (r - 4);
        const y1 = size/2 + Math.sin(a) * (r - 4);
        const x2 = size/2 + Math.cos(a) * (r + 4);
        const y2 = size/2 + Math.sin(a) * (r + 4);
        return <line key={d} x1={x1} y1={y1} x2={x2} y2={y2} stroke={theme.rule} strokeWidth={1} />;
      })}
      <text x={size/2} y={size/2 + 4} textAnchor="middle" fontFamily="JetBrains Mono, monospace"
        fontSize={size * 0.24} fill={theme.ink} fontWeight={500}>
        {Math.round(value)}<tspan fontSize={size * 0.14} fill={theme.inkFaint}>%</tspan>
      </text>
    </svg>
    {label && <Meta style={{ textAlign: 'center', lineHeight: 1.2 }}>{label}</Meta>}
    {sub && <Mono dim size={10}>{sub}</Mono>}
  </div>;
}

// ── Tick / cross / circle (used inline as status glyphs) ───────────────────
function Glyph({ kind, color, size = 12 }) {
  const { theme } = useApp();
  const c = color || theme.ink;
  if (kind === 'check') return <svg width={size} height={size} viewBox="0 0 12 12" fill="none">
    <path d="M2 6.5 L5 9.5 L10 3" stroke={c} strokeWidth="1.5" strokeLinecap="square" />
  </svg>;
  if (kind === 'cross') return <svg width={size} height={size} viewBox="0 0 12 12" fill="none">
    <path d="M2.5 2.5 L9.5 9.5 M9.5 2.5 L2.5 9.5" stroke={c} strokeWidth="1.5" strokeLinecap="square" />
  </svg>;
  if (kind === 'circle') return <svg width={size} height={size} viewBox="0 0 12 12" fill="none">
    <circle cx="6" cy="6" r="4.5" stroke={c} strokeWidth="1.4" fill="none" />
  </svg>;
  if (kind === 'arrow-right') return <svg width={size} height={size} viewBox="0 0 12 12" fill="none">
    <path d="M2 6 H9 M6.5 3 L9 6 L6.5 9" stroke={c} strokeWidth="1.4" strokeLinecap="square" fill="none" />
  </svg>;
  if (kind === 'lock') return <svg width={size} height={size} viewBox="0 0 12 12" fill="none">
    <rect x="2.5" y="5.5" width="7" height="5" stroke={c} strokeWidth="1.2" fill="none" />
    <path d="M4 5.5 V4 a2 2 0 0 1 4 0 V5.5" stroke={c} strokeWidth="1.2" fill="none" />
  </svg>;
  return null;
}

// ── Sparkline / bar chart ───────────────────────────────────────────────────
function Spark({ data, height = 36, color }) {
  const { theme } = useApp();
  const c = color || theme.accent;
  if (!data || !data.length) return null;
  const max = Math.max(...data, 1);
  const w = 100;
  const pts = data.map((v,i) => {
    const x = (i / (data.length - 1)) * w;
    const y = height - (v / max) * (height - 4) - 2;
    return `${x},${y}`;
  }).join(' ');
  return <svg viewBox={`0 0 ${w} ${height}`} preserveAspectRatio="none" style={{ width: '100%', height, display: 'block' }}>
    <polyline points={pts} fill="none" stroke={c} strokeWidth="1.2" />
  </svg>;
}

function MiniBars({ data, height = 36, color, max }) {
  const { theme } = useApp();
  const c = color || theme.accent;
  if (!data || !data.length) return null;
  const m = max || Math.max(...data, 1);
  const w = 100;
  const gap = 1;
  const bw = (w / data.length) - gap;
  return <svg viewBox={`0 0 ${w} ${height}`} preserveAspectRatio="none" style={{ width: '100%', height, display: 'block' }}>
    {data.map((v,i) => {
      const h = (v / m) * (height - 2);
      return <rect key={i} x={i * (bw + gap)} y={height - h} width={bw} height={h} fill={c} opacity={0.7} />;
    })}
  </svg>;
}

// ── Spider chart (used in Onboarding stat preview & Character overview) ────
function Spider({ values, labels, size = 220, color }) {
  const { theme } = useApp();
  const c = color || theme.accent;
  const cx = size / 2;
  const cy = size / 2;
  const r = size / 2 - 30;
  const n = values.length;
  const pts = values.map((v,i) => {
    const a = (i / n) * Math.PI * 2 - Math.PI / 2;
    const rr = (v / 100) * r;
    return [cx + Math.cos(a) * rr, cy + Math.sin(a) * rr];
  });
  const polyStr = pts.map(p => p.join(',')).join(' ');
  const axes = labels.map((l,i) => {
    const a = (i / n) * Math.PI * 2 - Math.PI / 2;
    const x = cx + Math.cos(a) * r;
    const y = cy + Math.sin(a) * r;
    const lx = cx + Math.cos(a) * (r + 16);
    const ly = cy + Math.sin(a) * (r + 16);
    return { x, y, lx, ly, label: l };
  });
  return <svg width={size} height={size}>
    {[0.25, 0.5, 0.75, 1].map((k, i) => (
      <polygon key={i}
        points={labels.map((_,j) => {
          const a = (j / n) * Math.PI * 2 - Math.PI / 2;
          return `${cx + Math.cos(a) * r * k},${cy + Math.sin(a) * r * k}`;
        }).join(' ')}
        fill="none" stroke={theme.rule2} strokeWidth={0.7} />
    ))}
    {axes.map((a,i) => (
      <line key={i} x1={cx} y1={cy} x2={a.x} y2={a.y} stroke={theme.rule2} strokeWidth={0.7} />
    ))}
    <polygon points={polyStr} fill={c} fillOpacity={0.15} stroke={c} strokeWidth={1.2} />
    {pts.map((p,i) => (
      <circle key={i} cx={p[0]} cy={p[1]} r={2} fill={c} />
    ))}
    {axes.map((a,i) => (
      <text key={i} x={a.lx} y={a.ly} fontSize={9} fontFamily="JetBrains Mono, monospace"
        fill={theme.inkDim} textAnchor="middle" dominantBaseline="middle"
        letterSpacing="0.12em">{a.label}</text>
    ))}
  </svg>;
}

// ── Section helpers ─────────────────────────────────────────────────────────
function ScreenScroll({ children, style }) {
  return <div className="ls-scroll" style={{
    height: '100%', overflowY: 'auto', overflowX: 'hidden', ...style,
  }}>{children}</div>;
}

Object.assign(window, {
  Rule, Mono, Meta, Pill, Btn, RowLink, Card, PageHeader,
  StatBar, Stamp, Ring, Glyph, Spark, MiniBars, Spider, ScreenScroll,
});
</script>

<!-- flows.jsx -->
<script type="text/babel">
// flows.jsx — Overlay flows: Morning, Evening, Proof, Fail-confirm, Sunday Ritual.

function FlowOverlay({ device }) {
  const { overlay, setOverlay } = useApp();
  if (!overlay) return null;
  const close = () => setOverlay(null);
  return <OverlayShell onClose={close} device={device}>
    {overlay.kind === 'morning'      && <MorningFlow onDone={close} />}
    {overlay.kind === 'evening'      && <EveningFlow onDone={close} />}
    {overlay.kind === 'proof'        && <ProofFlow questId={overlay.questId} onDone={close} />}
    {overlay.kind === 'fail-confirm' && <FailConfirm questId={overlay.questId} onDone={close} />}
    {overlay.kind === 'sunday'       && <SundayRitual onDone={close} device={device} />}
  </OverlayShell>;
}

function OverlayShell({ children, onClose, device }) {
  const { theme } = useApp();
  return <div style={{
    position: 'absolute', inset: 0, zIndex: 100,
    background: theme.bg,
    display: 'flex', flexDirection: 'column',
  }}>
    {/* Overlay header */}
    <div style={{
      padding: device === 'phone' ? '16px 18px' : '20px 28px',
      borderBottom: `1px solid ${theme.rule}`,
      display: 'flex', justifyContent: 'space-between', alignItems: 'center',
    }}>
      <Meta>THE SYSTEM</Meta>
      <button onClick={onClose} className="ls-press ls-mono" style={{
        background: 'transparent', border: 'none', color: theme.inkDim,
        fontSize: 11, letterSpacing: '0.16em', textTransform: 'uppercase',
        cursor: 'pointer',
      }}>Close ×</button>
    </div>
    <div style={{ flex: 1, overflowY: 'auto' }} className="ls-scroll">{children}</div>
  </div>;
}

// ── Morning Check-in ────────────────────────────────────────────────────────
function MorningFlow({ onDone }) {
  const { theme, voice, data, setData, setDayState } = useApp();
  const [step, setStep] = useS(1);
  const [energy, setEnergy] = useS(3);
  const [constraints, setConstraints] = useS('');
  const [mind, setMind] = useS('');
  const [exception, setException] = useS(false);
  const [generating, setGenerating] = useS(false);
  const next = () => setStep(s => s + 1);

  const submit = () => {
    setData(d => ({ ...d, energy }));
    setGenerating(true);
    setTimeout(() => {
      setDayState('mid-day');
      onDone();
    }, 1900);
  };

  if (generating) return <Generating energy={energy} />;

  return <div style={{ padding: '32px 22px 60px', maxWidth: 600, margin: '0 auto' }}>
    <Meta>MORNING CHECK-IN · {step}/3</Meta>
    <ProgressDots step={step} total={3} />

    {step === 1 && (
      <>
        <h2 style={{ fontFamily: 'Newsreader, serif', fontSize: 28, fontWeight: 400, marginTop: 18, color: theme.ink }}>
          What is your energy today?
        </h2>
        <p style={{ marginTop: 8, color: theme.inkDim, fontStyle: 'italic', fontWeight: 300 }}>
          Be honest. The System adjusts quest intensity to your input. Sandbagging now means a softer day; it also means a softer arc.
        </p>
        <div style={{ marginTop: 28, display: 'flex', flexDirection: 'column', gap: 8 }}>
          {[
            { v: 1, t: 'Empty', d: 'Sick, broken sleep, depleted. Easy quests only.' },
            { v: 2, t: 'Low',   d: 'Functional but reluctant. Stakes reduced.' },
            { v: 3, t: 'Even',  d: 'Standard. The default. The System uses this.' },
            { v: 4, t: 'Sharp', d: 'Operating cleanly. Push.' },
            { v: 5, t: 'Lit',   d: 'Rare. Use it. The System will.' },
          ].map(o => (
            <button key={o.v} onClick={() => setEnergy(o.v)} className="ls-press" style={{
              background: 'transparent', border: `1px solid ${energy === o.v ? theme.ink : theme.rule}`,
              padding: '14px 16px', textAlign: 'left', color: theme.ink, cursor: 'pointer',
              display: 'flex', alignItems: 'center', gap: 14, borderRadius: 0,
            }}>
              <span className="ls-mono" style={{ fontSize: 24, color: energy === o.v ? theme.ink : theme.inkMute, fontWeight: 500, width: 28 }}>
                {o.v}
              </span>
              <div>
                <div style={{ fontFamily: 'Newsreader, serif', fontSize: 17, color: theme.ink }}>{o.t}</div>
                <Mono dim size={11}>{o.d}</Mono>
              </div>
            </button>
          ))}
        </div>
        <Btn onClick={next} variant="primary" full style={{ marginTop: 24, padding: '14px 22px' }}>Continue →</Btn>
      </>
    )}

    {step === 2 && (
      <>
        <h2 style={{ fontFamily: 'Newsreader, serif', fontSize: 28, fontWeight: 400, marginTop: 18, color: theme.ink }}>
          Hard constraints today?
        </h2>
        <p style={{ marginTop: 8, color: theme.inkDim, fontStyle: 'italic', fontWeight: 300 }}>
          Meetings, travel, commitments not already on your calendar. Or "None".
        </p>
        <textarea
          value={constraints} onChange={(e) => setConstraints(e.target.value)}
          placeholder="None."
          style={{
            marginTop: 20, width: '100%', minHeight: 110, padding: '12px 14px',
            background: theme.surface, border: `1px solid ${theme.rule}`,
            color: theme.ink, fontFamily: 'Newsreader, serif', fontSize: 15,
            borderRadius: 0, resize: 'vertical', outline: 'none',
          }}
        />

        <div style={{ marginTop: 24, padding: '14px 16px', border: `1px solid ${theme.rule}`, display: 'flex', alignItems: 'flex-start', gap: 12 }}>
          <input type="checkbox" checked={exception} onChange={(e) => setException(e.target.checked)}
            style={{ marginTop: 4, accentColor: theme.warn }} />
          <div>
            <div style={{ fontFamily: 'Newsreader, serif', fontSize: 15, color: theme.ink }}>Declare exception clause.</div>
            <Mono dim size={11}>Max 1 / week. Quests defer; do not vanish. Penalty still calculates the empty day at 0%.</Mono>
          </div>
        </div>
        <Btn onClick={next} variant="primary" full style={{ marginTop: 24, padding: '14px 22px' }}>Continue →</Btn>
      </>
    )}

    {step === 3 && (
      <>
        <h2 style={{ fontFamily: 'Newsreader, serif', fontSize: 28, fontWeight: 400, marginTop: 18, color: theme.ink }}>
          One thing on your mind.
        </h2>
        <p style={{ marginTop: 8, color: theme.inkDim, fontStyle: 'italic', fontWeight: 300 }}>
          One sentence. Honest. The System uses this to frame today's directive and may issue a Bonus quest from it.
        </p>
        <textarea
          value={mind} onChange={(e) => setMind(e.target.value)}
          placeholder="..."
          style={{
            marginTop: 20, width: '100%', minHeight: 80, padding: '12px 14px',
            background: theme.surface, border: `1px solid ${theme.rule}`,
            color: theme.ink, fontFamily: 'Newsreader, serif', fontSize: 17, fontStyle: 'italic',
            borderRadius: 0, resize: 'vertical', outline: 'none',
          }}
        />
        <Btn onClick={submit} variant="primary" full style={{ marginTop: 24, padding: '14px 22px' }}>Generate Directive ▸</Btn>
      </>
    )}
  </div>;
}

function ProgressDots({ step, total }) {
  const { theme } = useApp();
  return <div style={{ display: 'flex', gap: 4, marginTop: 8 }}>
    {Array.from({ length: total }).map((_, i) => (
      <div key={i} style={{
        flex: 1, height: 2,
        background: i < step ? theme.ink : theme.rule,
      }} />
    ))}
  </div>;
}

// Generating screen — teletype "loading"
function Generating({ energy }) {
  const { theme, voice } = useApp();
  const messages = useM(() => [
    'Reading character sheet…',
    'Reading stat history…',
    'Reading arc state…',
    'Reading passive library…',
    'Calculating decay…',
    `Energy ${energy} accepted.`,
    'Selecting quests from library…',
    'Composing directive…',
  ], [energy]);
  const [idx, setIdx] = useS(0);
  useE(() => {
    if (idx < messages.length - 1) {
      const t = setTimeout(() => setIdx(i => i + 1), 220);
      return () => clearTimeout(t);
    }
  }, [idx]);
  return <div style={{
    height: '100%', display: 'flex', flexDirection: 'column', justifyContent: 'center', alignItems: 'center',
    padding: 24, gap: 16,
  }}>
    <Meta style={{ color: theme.accent }}>{voice.afterCheckin(energy)}</Meta>
    <h2 style={{ fontFamily: 'Newsreader, serif', fontSize: 26, fontWeight: 400, color: theme.ink, textAlign: 'center', maxWidth: 440 }}>
      The System is reading your state.
    </h2>
    <div className="ls-mono" style={{ marginTop: 14, color: theme.inkDim, fontSize: 12, textAlign: 'left' }}>
      {messages.slice(0, idx + 1).map((m, i) => (
        <div key={i} style={{ display: 'flex', gap: 8, alignItems: 'baseline' }}>
          <span style={{ color: theme.inkMute }}>›</span>
          <span style={{ color: i === idx ? theme.ink : theme.inkMute }}>{m}{i === idx && <span className="ls-cursor" style={{ color: theme.ink }}>_</span>}</span>
        </div>
      ))}
    </div>
  </div>;
}

// ── Evening Check-in ────────────────────────────────────────────────────────
function EveningFlow({ onDone }) {
  const { theme, voice, data, setDayState } = useApp();
  const [endEnergy, setEndEnergy] = useS(2);
  const [note, setNote] = useS('');
  const mandatory = data.quests.filter(q => !q.isBonus);
  const done = mandatory.filter(q => q.state === 'complete').length;
  const failed = mandatory.filter(q => q.state === 'failed').length;
  const xp = data.quests.filter(q => q.state === 'complete').reduce((s, q) => s + q.xp, 0);

  return <div style={{ padding: '28px 22px 60px', maxWidth: 600, margin: '0 auto' }}>
    <Meta>EVENING CLOSE</Meta>
    <h2 style={{ fontFamily: 'Newsreader, serif', fontSize: 28, fontWeight: 400, marginTop: 12, color: theme.ink }}>
      The day is being sealed.
    </h2>

    <div style={{
      marginTop: 22, display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)',
      border: `1px solid ${theme.rule}`,
    }}>
      {[
        { l: 'COMP', v: done },
        { l: 'FAIL', v: failed },
        { l: 'XP',  v: xp },
      ].map((c,i,a) => (
        <div key={i} style={{ padding: '14px 12px', borderRight: i < a.length - 1 ? `1px solid ${theme.rule}` : 'none' }}>
          <Meta>{c.l}</Meta>
          <div className="ls-num" style={{ fontSize: 24, marginTop: 4, color: theme.ink, fontWeight: 500 }}>{c.v}</div>
        </div>
      ))}
    </div>

    <div style={{ marginTop: 26 }}>
      <Meta>Energy at close</Meta>
      <div style={{ marginTop: 8, display: 'flex', gap: 6 }}>
        {[1,2,3,4,5].map(v => (
          <button key={v} onClick={() => setEndEnergy(v)} className="ls-press" style={{
            flex: 1, padding: '14px 0', background: 'transparent',
            border: `1px solid ${endEnergy === v ? theme.ink : theme.rule}`,
            color: endEnergy === v ? theme.ink : theme.inkDim,
            fontFamily: 'JetBrains Mono, monospace', fontSize: 16, cursor: 'pointer', borderRadius: 0,
          }}>{v}</button>
        ))}
      </div>
    </div>

    <div style={{ marginTop: 24 }}>
      <Meta>One sentence on the day</Meta>
      <textarea value={note} onChange={(e) => setNote(e.target.value)}
        placeholder="Honest. No format. Goes into the log."
        style={{
          marginTop: 8, width: '100%', minHeight: 100, padding: '12px 14px',
          background: theme.surface, border: `1px solid ${theme.rule}`,
          color: theme.ink, fontFamily: 'Newsreader, serif', fontSize: 15, fontStyle: 'italic',
          borderRadius: 0, resize: 'vertical', outline: 'none',
        }} />
    </div>

    <Btn onClick={() => { setDayState('all-complete'); onDone(); }} variant="primary" full style={{ marginTop: 24, padding: '14px 22px' }}>
      Close the day →
    </Btn>
  </div>;
}

// ── Proof Submission ───────────────────────────────────────────────────────
function ProofFlow({ questId, onDone }) {
  const { theme, voice, data, completeQuest } = useApp();
  const q = data.quests.find(x => x.id === questId);
  if (!q) return null;
  const [text, setText] = useS('');
  const [hasFile, setHasFile] = useS(false);
  const [url, setUrl] = useS('');
  const wordCount = text.trim() ? text.trim().split(/\s+/).length : 0;
  const submit = () => { completeQuest(questId); onDone(); };

  return <div style={{ padding: '28px 22px 60px', maxWidth: 600, margin: '0 auto' }}>
    <Meta>PROOF SUBMISSION · QUEST {q.id.toUpperCase()}</Meta>
    <h2 style={{ fontFamily: 'Newsreader, serif', fontSize: 24, fontWeight: 400, marginTop: 10, color: theme.ink }}>{q.title}</h2>

    <div style={{ marginTop: 18, padding: '10px 14px', background: theme.surface, borderLeft: `2px solid ${theme.accent}` }}>
      <Meta style={{ color: theme.accent }}>PROOF REQUIRED · {q.proofType}</Meta>
      <div style={{ marginTop: 4, fontSize: 14, color: theme.ink }}>{q.proofStandard}</div>
    </div>

    <Mono dim size={10} style={{ display: 'block', marginTop: 22, letterSpacing: '0.14em' }}>
      DEADLINE 22:00 IST · 4h 17m REMAINING
    </Mono>

    {q.proofType === 'Text paste' && (
      <>
        <textarea value={text} onChange={(e) => setText(e.target.value)}
          placeholder="Paste your writing here. Min 600 words."
          style={{
            marginTop: 10, width: '100%', minHeight: 240, padding: '14px 16px',
            background: theme.surface, border: `1px solid ${theme.rule}`,
            color: theme.ink, fontFamily: 'Newsreader, serif', fontSize: 14,
            borderRadius: 0, resize: 'vertical', outline: 'none', lineHeight: 1.5,
          }} />
        <div style={{ marginTop: 8, display: 'flex', justifyContent: 'space-between' }}>
          <Mono dim size={10}>WORD COUNT</Mono>
          <Mono size={11} style={{ color: wordCount >= 600 ? theme.good : theme.warn, fontWeight: 600 }}>
            {wordCount} / 600 {wordCount >= 600 ? '✓' : ''}
          </Mono>
        </div>
      </>
    )}

    {q.proofType === 'Screenshot' && (
      <DropZone label="DROP SCREENSHOT · OR TAP TO ATTACH" onAttach={() => setHasFile(true)} attached={hasFile} />
    )}

    {q.proofType === 'Health screenshot' && (
      <DropZone label="ATTACH HEALTH APP SCREENSHOT" onAttach={() => setHasFile(true)} attached={hasFile} subtext="Garmin · Apple Health · Strava. Today's date required." />
    )}

    {q.proofType === 'Link' && (
      <input value={url} onChange={(e) => setUrl(e.target.value)} placeholder="https://"
        style={{
          marginTop: 10, width: '100%', padding: '14px 16px',
          background: theme.surface, border: `1px solid ${theme.rule}`,
          color: theme.ink, fontFamily: 'JetBrains Mono, monospace', fontSize: 13,
          borderRadius: 0, outline: 'none',
        }} />
    )}

    <Btn onClick={submit} variant="primary" full style={{ marginTop: 24, padding: '14px 22px' }}
      disabled={q.proofType === 'Text paste' ? wordCount < 600 : (q.proofType === 'Link' ? !url : !hasFile)}>
      File Proof ▸
    </Btn>
  </div>;
}

function DropZone({ label, subtext, onAttach, attached }) {
  const { theme } = useApp();
  return <button onClick={onAttach} className="ls-press" style={{
    marginTop: 10, width: '100%', padding: '40px 20px',
    background: theme.surface, border: `1px dashed ${attached ? theme.good : theme.rule}`,
    color: theme.inkDim, cursor: 'pointer', borderRadius: 0,
    display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 8,
  }}>
    <Meta style={{ color: attached ? theme.good : theme.inkMute }}>
      {attached ? '✓ proof_2026-06-14.png · attached' : label}
    </Meta>
    {subtext && <Mono dim size={10}>{subtext}</Mono>}
  </button>;
}

// ── Fail Confirm ────────────────────────────────────────────────────────────
function FailConfirm({ questId, onDone }) {
  const { theme, voice, data, failQuest } = useApp();
  const q = data.quests.find(x => x.id === questId);
  if (!q) return null;
  const confirm = () => { failQuest(questId); onDone(); };

  return <div style={{ padding: '32px 22px 60px', maxWidth: 500, margin: '0 auto' }}>
    <Meta style={{ color: theme.danger }}>CONFIRM DEFAULT</Meta>
    <h2 style={{ fontFamily: 'Newsreader, serif', fontSize: 28, fontWeight: 400, marginTop: 14, color: theme.ink }}>
      {voice.abandonConfirm}
    </h2>

    <div style={{ marginTop: 22, padding: '14px 16px', border: `1px solid ${theme.danger}`, background: 'transparent' }}>
      <Meta style={{ color: theme.danger, marginBottom: 8 }}>WHAT FOLLOWS</Meta>
      <div style={{ display: 'flex', flexDirection: 'column', gap: 6 }}>
        {[
          `Day ${data.player.day} closes with default on ${q.stat}.`,
          `Penalty Dungeon queues for Day ${data.player.day + 1}. Cannot be declined.`,
          `Arc "${data.arc.title}" pauses until dungeon clears.`,
          `Week ${data.week.number} completion rate drops by 4.8%.`,
          'No appeal panel exists. The System is not designed to accept appeals.',
        ].map((line, i) => (
          <div key={i} style={{ display: 'flex', alignItems: 'baseline', gap: 8 }}>
            <Mono dim size={11}>—</Mono>
            <span style={{ color: theme.ink, fontSize: 13 }}>{line}</span>
          </div>
        ))}
      </div>
    </div>

    <div style={{ display: 'flex', gap: 10, marginTop: 24 }}>
      <Btn onClick={onDone} variant="ghost" full style={{ padding: '14px 22px' }}>Step Back</Btn>
      <Btn onClick={confirm} variant="primary" danger full style={{ padding: '14px 22px' }}>Confirm Default</Btn>
    </div>
  </div>;
}

// ── Sunday Ritual ───────────────────────────────────────────────────────────
function SundayRitual({ onDone, device }) {
  const { theme, voice, data } = useApp();
  const [step, setStep] = useS(1);
  const [refereeOk, setRefereeOk] = useS(false);
  const [receipt, setReceipt] = useS(false);
  const [confirmed, setConfirmed] = useS(false);
  const [reflection, setReflection] = useS('');
  const w = data.week;
  const penalty = w.rate >= 90 ? 0 : w.rate >= 75 ? 2500 : 5000;
  const steps = [
    'Count Verification',
    'Contact Referee',
    'Penalty Display',
    'Transfer to Recipient',
    'Receipt Upload',
    'Referee Confirmation',
    'Reflection Note',
    'Open Next Week',
  ];

  return <div style={{ padding: '24px 22px 60px', maxWidth: 640, margin: '0 auto' }}>
    <Meta>{voice.sundayOpen} · WK {String(w.number).padStart(2,'0')}</Meta>
    <h2 style={{ fontFamily: 'Newsreader, serif', fontSize: 28, fontWeight: 400, marginTop: 12, color: theme.ink }}>
      Sunday Ritual · Step {step}/8
    </h2>

    {/* Step rail */}
    <div style={{ marginTop: 22, display: 'flex', gap: 4 }}>
      {steps.map((_, i) => (
        <div key={i} style={{
          flex: 1, height: 2,
          background: i < step ? theme.ink : theme.rule,
        }} />
      ))}
    </div>
    <Mono dim size={10} style={{ display: 'block', marginTop: 8 }}>STEP · {steps[step - 1]}</Mono>

    <div style={{ marginTop: 24, minHeight: 280 }}>
      {step === 1 && (
        <>
          <h3 style={{ fontFamily: 'Newsreader, serif', fontSize: 22, color: theme.ink, fontWeight: 400 }}>
            Confirm the Count.
          </h3>
          <p style={{ marginTop: 8, color: theme.inkDim, fontStyle: 'italic', fontWeight: 300 }}>
            Pulled from Notion. Verify on your screen and on theirs.
          </p>
          <div style={{
            marginTop: 18, padding: '14px 16px', border: `1px solid ${theme.rule}`,
            display: 'grid', gridTemplateColumns: 'repeat(4, 1fr)', gap: 0,
          }}>
            {[
              { l: 'ASSIGNED', v: w.assigned },
              { l: 'COMPLETE', v: w.complete },
              { l: 'FAILED',   v: w.failed },
              { l: 'RATE',     v: `${w.rate}%` },
            ].map((c, i, a) => (
              <div key={i} style={{ padding: '6px 8px', borderRight: i < a.length - 1 ? `1px solid ${theme.rule2}` : 'none' }}>
                <Meta>{c.l}</Meta>
                <div className="ls-num" style={{ fontSize: 20, marginTop: 4 }}>{c.v}</div>
              </div>
            ))}
          </div>
        </>
      )}

      {step === 2 && (
        <>
          <h3 style={{ fontFamily: 'Newsreader, serif', fontSize: 22, color: theme.ink, fontWeight: 400 }}>
            Call the Referee.
          </h3>
          <p style={{ marginTop: 8, color: theme.inkDim, fontStyle: 'italic', fontWeight: 300 }}>
            Mom must see the same ledger before you proceed. This is not negotiable.
          </p>
          <div style={{
            marginTop: 18, padding: '20px', border: `1px solid ${theme.rule}`,
            display: 'flex', flexDirection: 'column', gap: 10, alignItems: 'flex-start',
          }}>
            <Meta>REFEREE</Meta>
            <div style={{ fontFamily: 'Newsreader, serif', fontSize: 22, color: theme.ink }}>Mom</div>
            <Mono dim size={11}>+91 *** *** 4421</Mono>
            <button onClick={() => setRefereeOk(true)} className="ls-press" style={{
              marginTop: 10, padding: '10px 18px',
              background: refereeOk ? theme.good : theme.ink, color: theme.bg, border: 'none',
              fontFamily: 'JetBrains Mono, monospace', fontSize: 11, letterSpacing: '0.18em',
              textTransform: 'uppercase', cursor: 'pointer', borderRadius: 0,
            }}>
              {refereeOk ? '✓ Connected · Continuing' : 'Dial Now'}
            </button>
          </div>
        </>
      )}

      {step === 3 && (
        <>
          <h3 style={{ fontFamily: 'Newsreader, serif', fontSize: 22, color: theme.ink, fontWeight: 400 }}>
            Penalty Owed.
          </h3>
          <div style={{
            marginTop: 18, padding: '40px 20px', border: `1px solid ${penalty > 0 ? theme.danger : theme.good}`,
            textAlign: 'center',
          }}>
            <Meta style={{ color: penalty > 0 ? theme.danger : theme.good }}>
              {penalty > 0 ? 'TRANSFER REQUIRED' : 'CLEAN WEEK'}
            </Meta>
            <div className="ls-num" style={{
              fontSize: 56, color: penalty > 0 ? theme.danger : theme.good,
              fontWeight: 500, marginTop: 8, letterSpacing: '-0.02em',
            }}>
              ₹{penalty.toLocaleString('en-IN')}
            </div>
            <Mono dim size={11} style={{ marginTop: 10 }}>{voice.sundayPenalty(penalty)}</Mono>
          </div>
        </>
      )}

      {step === 4 && (
        <>
          <h3 style={{ fontFamily: 'Newsreader, serif', fontSize: 22, color: theme.ink, fontWeight: 400 }}>Initiate Transfer.</h3>
          <p style={{ marginTop: 8, color: theme.inkDim, fontStyle: 'italic', fontWeight: 300 }}>UPI deep link opens your bank app with recipient and amount pre-filled.</p>
          <div style={{
            marginTop: 18, padding: '18px', border: `1px solid ${theme.rule}`,
            display: 'flex', flexDirection: 'column', gap: 8,
          }}>
            {[
              ['To',     'Dad · ***@axisbank'],
              ['Amount', `₹${penalty.toLocaleString('en-IN')}`],
              ['Note',   `WK ${w.number} Penalty · No Return`],
              ['Witness','Mom (present)'],
            ].map(([l,v]) => (
              <div key={l} style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline',
                paddingBottom: 6, borderBottom: `1px dashed ${theme.rule2}` }}>
                <Meta>{l}</Meta>
                <Mono size={13} style={{ color: theme.ink }}>{v}</Mono>
              </div>
            ))}
          </div>
        </>
      )}

      {step === 5 && (
        <>
          <h3 style={{ fontFamily: 'Newsreader, serif', fontSize: 22, color: theme.ink, fontWeight: 400 }}>Upload Receipt.</h3>
          <DropZone label="DROP UPI CONFIRMATION SCREENSHOT" attached={receipt} onAttach={() => setReceipt(true)} />
        </>
      )}

      {step === 6 && (
        <>
          <h3 style={{ fontFamily: 'Newsreader, serif', fontSize: 22, color: theme.ink, fontWeight: 400 }}>Referee Confirmation.</h3>
          <p style={{ marginTop: 8, color: theme.inkDim, fontStyle: 'italic', fontWeight: 300 }}>This box cannot be self-checked. Have Mom press it.</p>
          <div style={{
            marginTop: 18, padding: '20px', border: `1px solid ${theme.rule}`,
            display: 'flex', alignItems: 'center', gap: 16, cursor: 'pointer',
          }} onClick={() => setConfirmed(c => !c)}>
            <div style={{
              width: 22, height: 22, border: `1.5px solid ${confirmed ? theme.good : theme.rule}`,
              display: 'flex', alignItems: 'center', justifyContent: 'center',
            }}>
              {confirmed && <Glyph kind="check" color={theme.good} size={14} />}
            </div>
            <div>
              <div style={{ fontFamily: 'Newsreader, serif', fontSize: 16, color: theme.ink }}>
                Mom confirms the ledger and the payment.
              </div>
              <Mono dim size={10} style={{ marginTop: 2 }}>BINDING · WRITTEN TO PENALTY LOG</Mono>
            </div>
          </div>
        </>
      )}

      {step === 7 && (
        <>
          <h3 style={{ fontFamily: 'Newsreader, serif', fontSize: 22, color: theme.ink, fontWeight: 400 }}>Reflection.</h3>
          <p style={{ marginTop: 8, color: theme.inkDim, fontStyle: 'italic', fontWeight: 300 }}>2–3 sentences. 100-character minimum. The System keeps this honest.</p>
          <textarea value={reflection} onChange={(e) => setReflection(e.target.value)}
            style={{
              marginTop: 12, width: '100%', minHeight: 120, padding: '14px 16px',
              background: theme.surface, border: `1px solid ${theme.rule}`,
              color: theme.ink, fontFamily: 'Newsreader, serif', fontSize: 15, fontStyle: 'italic',
              borderRadius: 0, resize: 'vertical', outline: 'none',
            }} />
          <Mono size={10} dim style={{ display: 'block', textAlign: 'right', marginTop: 4 }}>
            {reflection.length}/100
          </Mono>
        </>
      )}

      {step === 8 && (
        <>
          <h3 style={{ fontFamily: 'Newsreader, serif', fontSize: 22, color: theme.ink, fontWeight: 400 }}>Open Week {w.number + 1}.</h3>
          <p style={{ marginTop: 8, color: theme.inkDim, fontStyle: 'italic', fontWeight: 300 }}>
            Stats roll forward. Passives recalculate. Monday is clean. This is the only mercy the System grants.
          </p>
          <div style={{
            marginTop: 22, padding: '24px', border: `1px solid ${theme.good}`,
            display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 14,
          }}>
            <Stamp text="WEEK SEALED" sub={`WK ${w.number} · ${w.rate}%`} color={theme.good} size="lg" />
          </div>
        </>
      )}
    </div>

    <div style={{ display: 'flex', gap: 10, marginTop: 24 }}>
      {step > 1 && <Btn onClick={() => setStep(step - 1)} variant="ghost" style={{ padding: '12px 18px' }}>← Back</Btn>}
      <Btn onClick={step === 8 ? onDone : () => setStep(step + 1)} variant="primary" full style={{ padding: '12px 18px' }}>
        {step === 8 ? 'Close Ritual ▸' : 'Continue →'}
      </Btn>
    </div>
  </div>;
}

Object.assign(window, { FlowOverlay, MorningFlow, EveningFlow, ProofFlow, FailConfirm, SundayRitual });
</script>

function YesterdaySummary() {

}

// ── Arc mini card ───────────────────────────────────────────────────────────
function ArcMini({ arc, style }) {

  return <div onClick={() => setRoute({ tab: 'quests', sub: 'arc', params: {} })}

      <Mono size={10} style={{ color: theme.warn }}>NEED {arc.paceRequired}% / DAY</Mono>
    </div>

}

// ── Active Directive ────────────────────────────────────────────────────────

function ActiveDirective({ device, showStamp }) {
  const { theme, voice, data, dayState, setOverlay } = useApp();
  const mandatory = data.quests.filter(q => !q.isBonus);
  const bonus = data.quests.find(q => q.isBonus);
  const completedCount = mandatory.filter(q => q.state === 'complete').length;
  const failedCount = mandatory.filter(q => q.state === 'failed').length;
  const allDone = completedCount === mandatory.length;

  return <ScreenScroll>
    <div style={{ padding: device === 'phone' ? '20px 18px 28px' : '34px 40px 44px', position: 'relative' }}>

      {/* Directive header */}
      <Meta>DIRECTIVE · DAY {String(data.player.day).padStart(2,'0')} · ISSUED 07:14 IST</Meta>
      <h1 style={{
        fontFamily: 'Newsreader, serif', fontSize: device === 'phone' ? 26 : 36,
        fontWeight: 400, marginTop: 10, color: theme.ink, letterSpacing: '-0.015em', lineHeight: 1.1,
      }}>
        The System has read your state.
      </h1>

      {/* The directive note */}
      <div style={{
        marginTop: 14, padding: '14px 16px', borderLeft: `2px solid ${theme.accent}`,
        background: theme.surface,
      }}>
        <Meta style={{ color: theme.accent, marginBottom: 6 }}>THE SYSTEM SAYS</Meta>
        <div style={{ fontFamily: 'Newsreader, serif', fontSize: 15, fontStyle: 'italic', fontWeight: 300, color: theme.ink, lineHeight: 1.45 }}>
          {voice.directiveNote()}
        </div>
      </div>

      {/* Weekly status bar */}
      <WeekStatus />

      {/* Mandatory quests */}
      <div style={{ marginTop: 22, display: 'flex', alignItems: 'baseline', justifyContent: 'space-between' }}>
        <Meta>Mandatory · {completedCount + failedCount}/{mandatory.length} settled</Meta>

      <div style={{ marginTop: 8 }}>
        {mandatory.map(q => <QuestCard key={q.id} quest={q} />)}

      {bonus && (
        <>
          <div style={{ marginTop: 26 }}>
            <Meta>Bonus · Optional</Meta>
          </div>
          <div style={{ marginTop: 8 }}>
            <QuestCard quest={bonus} bonus />
          </div>

      )}

      {/* End-of-day CTA */}
      {(dayState === 'evening' || dayState === 'all-complete') && (
        <button onClick={() => setOverlay({ kind: 'evening' })} className="ls-press" style={{
          marginTop: 28, width: '100%', padding: '16px 22px',
          background: 'transparent', color: theme.ink, border: `1px solid ${theme.ink}`,
          fontFamily: 'JetBrains Mono, monospace', fontSize: 12, letterSpacing: '0.24em',
          textTransform: 'uppercase', fontWeight: 500,
          display: 'flex', alignItems: 'center', justifyContent: 'space-between',

          <span>Begin Evening Close</span>

      {(showStamp || allDone) && <DayCompleteStamp />}

function WeekStatus() {
  const { theme, data } = useApp();
  const w = data.week;
  return <div style={{
    marginTop: 18, display: 'grid',
    gridTemplateColumns: 'repeat(4, 1fr)',
    border: `1px solid ${theme.rule}`,
  }}>
    {[
      { l: 'WK', v: String(w.number).padStart(2,'0') },
      { l: 'COMP', v: `${w.complete}/${w.assigned}` },
      { l: 'RATE', v: `${w.rate}%` },

      <div key={i} style={{
        padding: '10px 12px',
        borderRight: i < a.length - 1 ? `1px solid ${theme.rule}` : 'none',

        <div className="ls-num" style={{ fontSize: 18, color: theme.ink, fontWeight: 500, marginTop: 4 }}>{c.v}</div>
      </div>

}

// ── Quest Card ──────────────────────────────────────────────────────────────

function QuestCard({ quest, bonus }) {
  const { theme, voice, data, completeQuest, failQuest, setOverlay, setRoute } = useApp();
  const [expanded, setExpanded] = useS(false);
  const isDone = quest.state === 'complete';
  const isFailed = quest.state === 'failed';
  const statColor = theme.stat[quest.stat];
  const cardOpacity = (isDone || isFailed) ? 0.6 : 1;

  return <div style={{
    position: 'relative',
    borderTop: `1px solid ${isFailed ? theme.danger : isDone ? theme.good : statColor}`,
    paddingTop: 12, paddingBottom: 14,
    opacity: bonus ? 0.78 : 1,
  }}>
    <div style={{ display: 'flex', alignItems: 'baseline', justifyContent: 'space-between', gap: 12, opacity: cardOpacity }}>
      <div style={{ display: 'flex', gap: 8, alignItems: 'baseline', flexWrap: 'wrap' }}>
        <Pill color={statColor} border={statColor}>{quest.stat}</Pill>
        <Pill color={theme.inkDim}>{quest.difficulty}</Pill>
        {quest.isArc && <Pill color={theme.accent} border={theme.accent}>ARC</Pill>}
        {bonus && <Pill color={theme.inkMute}>BONUS</Pill>}
      </div>
      <Mono size={10} dim style={{ flexShrink: 0 }}>+{quest.xp} XP · +{quest.points} {quest.stat}</Mono>
    </div>

    <h3 style={{
      marginTop: 10, fontFamily: 'Newsreader, serif', fontSize: 17, fontWeight: 500,
      color: theme.ink, opacity: cardOpacity, letterSpacing: '-0.005em', lineHeight: 1.25,
    }}>{quest.title}</h3>

    {expanded && !isDone && !isFailed && (
      <p style={{ marginTop: 8, color: theme.inkDim, fontSize: 14, lineHeight: 1.5 }}>
        {quest.brief}
      </p>
    )}

    {expanded && !isDone && !isFailed && (
      <div style={{ marginTop: 14, padding: '10px 12px', background: theme.surface, borderLeft: `2px solid ${theme.rule}` }}>
        <Meta style={{ marginBottom: 4 }}>PROOF STANDARD · {quest.proofType}</Meta>
        <div style={{ fontSize: 13, color: theme.ink }}>{quest.proofStandard}</div>
      </div>
    )}

    <div style={{ marginTop: 12, display: 'flex', alignItems: 'center', gap: 10, opacity: cardOpacity }}>
      {!isDone && !isFailed && (
        <>
          <button onClick={() => setExpanded(!expanded)} className="ls-press ls-mono" style={{
            background: 'transparent', border: `1px solid ${theme.rule}`,
            color: theme.inkDim, padding: '6px 10px', fontSize: 10, letterSpacing: '0.14em',
            textTransform: 'uppercase', borderRadius: 0, cursor: 'pointer',
          }}>{expanded ? 'Collapse' : 'Brief'}</button>

          <button onClick={() => setOverlay({ kind: 'proof', questId: quest.id })} className="ls-press ls-mono" style={{
            background: theme.ink, border: `1px solid ${theme.ink}`,
            color: theme.bg, padding: '6px 14px', fontSize: 10, letterSpacing: '0.14em',
            textTransform: 'uppercase', borderRadius: 0, fontWeight: 600, cursor: 'pointer',
          }}>{voice.completeCTA}</button>

          <button onClick={() => setOverlay({ kind: 'fail-confirm', questId: quest.id })} className="ls-press ls-mono" style={{
            background: 'transparent', border: `1px solid ${theme.danger}`,
            color: theme.danger, padding: '6px 10px', fontSize: 10, letterSpacing: '0.14em',
            textTransform: 'uppercase', borderRadius: 0, cursor: 'pointer', marginLeft: 'auto',
          }}>{voice.failCTA}</button>
        </>
      )}
      {isDone && (
        <Mono size={10} dim style={{ marginLeft: 'auto' }}>
          <Glyph kind="check" color={theme.good} size={10} /> &nbsp; PROOF FILED · 14:22 IST
        </Mono>
      )}
      {isFailed && (
        <Mono size={10} style={{ marginLeft: 'auto', color: theme.danger }}>
          DEFAULT RECORDED
        </Mono>
      )}
    </div>

    {/* Stamps */}
    {isDone && (
      <div style={{ position: 'absolute', top: 30, right: 16, pointerEvents: 'none' }}>
        <Stamp text="FILED" color={theme.good} sub="22:14 IST" />
      </div>
    )}
    {isFailed && (
      <div style={{ position: 'absolute', top: 30, right: 16, pointerEvents: 'none' }}>
        <Stamp text="ABANDONED" color={theme.danger} sub={`DAY ${data.player.day} · DEFAULT`} animate />
      </div>
    )}
  </div>;
}

// ── Day Complete Stamp (large) ──────────────────────────────────────────────
function DayCompleteStamp() {
  const { theme, voice, data } = useApp();
  return <div style={{
    marginTop: 30, padding: '32px 20px', border: `1px solid ${theme.rule}`,
    display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 12,
  }}>
    <Stamp text={voice.allComplete} sub={`DAY ${data.player.day} · 22:47 IST`} size="lg" color={theme.good} animate />
    <Mono dim size={10} style={{ marginTop: 4 }}>
      +{data.quests.filter(q => q.state === 'complete' && !q.isBonus).reduce((s,q) => s + q.xp, 0)} XP · STREAK +1
    </Mono>
  </div>;
}

Object.assign(window, { DirectiveTab, PreCheckin, ActiveDirective, ArcMini });
</script>

// ── Stat Detail ─────────────────────────────────────────────────────────────
function StatDetail({ device }) {
  const { theme, data, route, setRoute, density } = useApp();
  const s = route.params.stat || 'CRAFT';
  const color = theme.stat[s];
  const score = data.stats[s];
  const decay = data.decay[s];
  const tier = score >= 90 ? 4 : score >= 70 ? 3 : score >= 50 ? 2 : score >= 30 ? 1 : 0;
  const nextTier = tier < 4 ? [30,50,70,90][tier] : null;
  // Synthetic 30-day history
  const history = useM(() => Array.from({ length: 30 }, (_, i) => Math.max(0, Math.round(score * (0.4 + 0.6 * (i + 1) / 30) + (Math.random() - 0.5) * 3))), [s, score]);
  const stateSkills = data.skills.filter(sk => sk.stat === s);
  const recent = data.questLog.filter(q => q.stat === s).slice(0, 5);

  return <ScreenScroll>
    <div style={{ padding: device === 'phone' ? '18px 18px 28px' : '28px 40px 44px', maxWidth: 920 }}>
      <button onClick={() => setRoute({ tab: 'character', sub: null, params: {} })}
        className="ls-press ls-mono" style={{
          background: 'transparent', border: 'none', color: theme.inkMute, padding: 0,
          fontSize: 11, letterSpacing: '0.18em', textTransform: 'uppercase', cursor: 'pointer',
        }}>← Character</button>

      <div style={{ marginTop: 14, display: 'flex', alignItems: 'flex-start', justifyContent: 'space-between', gap: 20 }}>
        <div>
          <Meta style={{ color }}>STAT · {s}</Meta>
          <h1 style={{ fontFamily: 'Newsreader, serif', fontSize: 32, fontWeight: 400, marginTop: 6, color: theme.ink, fontStyle: 'italic' }}>
            {STAT_DESC[s]}
          </h1>
        </div>
        <div style={{ textAlign: 'right' }}>
          <div className="ls-num" style={{ fontSize: 64, fontWeight: 300, color: theme.ink, lineHeight: 1, letterSpacing: '-0.02em' }}>
            {String(score).padStart(2, '0')}
          </div>
          <Mono dim size={10} style={{ display: 'block', marginTop: 4 }}>/ 100</Mono>
        </div>
      </div>

      {/* Tier ladder */}
      <div style={{ marginTop: 24 }}>
        <Meta>SKILL TIER {tier > 0 ? `· ${tier} UNLOCKED` : ' · NONE'}</Meta>
        <div style={{ marginTop: 8, display: 'flex', gap: 6 }}>
          {[30, 50, 70, 90].map((t, i) => (
            <div key={t} style={{
              flex: 1, padding: '10px 12px',
              border: `1px solid ${score >= t ? color : theme.rule}`,
              background: score >= t ? `${color}1a` : 'transparent',
            }}>
              <Mono size={10} dim>T{i + 1} · {t}</Mono>
              <div style={{ fontSize: 12, marginTop: 4, color: score >= t ? theme.ink : theme.inkMute,
                fontFamily: 'Newsreader, serif' }}>
                {stateSkills[i]?.name || '—'}
              </div>
            </div>
          ))}
        </div>
        {nextTier && (
          <Mono dim size={10} style={{ display: 'block', marginTop: 8 }}>
            {nextTier - score} POINTS TO NEXT TIER · {stateSkills.find(sk => sk.req === nextTier)?.name}
          </Mono>
        )}
      </div>

      {/* Decay status */}
      <div style={{
        marginTop: 22, padding: '12px 14px',
        border: `1px solid ${decay >= 14 ? theme.danger : decay >= 10 ? theme.warn : theme.rule}`,
      }}>
        <div style={{ display: 'flex', justifyContent: 'space-between' }}>
          <Meta style={{ color: decay >= 14 ? theme.danger : decay >= 10 ? theme.warn : theme.good }}>
            {decay >= 14 ? 'DECAYING' : decay >= 10 ? 'WARNING' : 'HEALTHY'}
          </Meta>
          <Mono size={11}>{decay}D SINCE LAST ACTIVITY</Mono>
        </div>
      </div>

      {/* Chart */}
      <div style={{ marginTop: 22 }}>
        <Meta style={{ marginBottom: 8 }}>30-DAY HISTORY</Meta>
        <div style={{ border: `1px solid ${theme.rule2}`, padding: '10px 12px' }}>
          <Spark data={history} height={60} color={color} />
          <div style={{ marginTop: 6, display: 'flex', justifyContent: 'space-between' }}>
            <Mono dim size={10}>{data.player.day - 30}D</Mono>
            <Mono dim size={10}>NOW</Mono>
          </div>
        </div>
      </div>

      {/* Recent quests */}
      <div style={{ marginTop: 22 }}>
        <Meta style={{ marginBottom: 8 }}>RECENT QUESTS · {s}</Meta>
        <div style={{ borderTop: `1px solid ${theme.rule2}` }}>
          {recent.length === 0 ? (
            <div style={{ padding: '12px 0', color: theme.inkMute, fontSize: 13, fontStyle: 'italic' }}>
              No recent quests. This is why it is dormant.
            </div>
          ) : recent.map(q => (
            <div key={q.id} style={{
              padding: '8px 0', borderBottom: `1px solid ${theme.rule2}`,
              display: 'flex', alignItems: 'center', gap: 12,
            }}>
              <Glyph kind={q.status === 'complete' ? 'check' : 'cross'} color={q.status === 'complete' ? theme.ink : theme.danger} />

              <Mono dim size={10}>+{q.xp} XP</Mono>
            </div>
          ))}
        </div>
      </div>
    </div>
  </ScreenScroll>;

// Renders the active tab. Hosts the failure-flash overlay. Hosts flow overlays.

function LifeOSApp({ device }) {

      <div style={{ flex: 1, overflow: 'hidden', position: 'relative' }}>
        {route.tab === 'directive' && <DirectiveTab device={device} />}
        {route.tab === 'character' && <CharacterTab device={device} />}
        {route.tab === 'quests'    && <QuestsTab    device={device} />}
        {route.tab === 'ledger'    && <LedgerTab    device={device} />}
      </div>
      {device === 'phone' && <PhoneTabBar />}
    </div>
    <FlowOverlay device={device} />

}

function TweaksUI() {
  const { themeKey, voiceKey, densityKey, dayState, setDayState } = useApp();
  // we need to set the parent tweaks
  return null; // panel mounted at root with its own state
}

Object.assign(window, { LifeOSApp });
</script>

<script type="text/babel" data-presets="env,react">

  injectGlobalStyles();

  // Persisted defaults — these survive Tweaks edits via the host bridge.
  const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
    "theme": "vellum",
    "voice": "cold",
    "density": "comfortable",
    "dayState": "mid-day"
  }/*EDITMODE-END*/;

  const { useState, useEffect } = React;

  function Root() {
    const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
    // Independent dayState in case user wants to swap quickly without persisting
    const [dayState, setDayState] = useState(t.dayState);
    useEffect(() => { setDayState(t.dayState); }, [t.dayState]);

    return (
      <AppProvider
        theme={t.theme}
        voice={t.voice}
        density={t.density}
        dayState={dayState}
        setDayState={(ds) => { setDayState(ds); setTweak('dayState', ds); }}
      >
        <Canvas />
        <TweaksUI t={t} setTweak={setTweak} />
      </AppProvider>
    );
  }

  function TweaksUI({ t, setTweak }) {
    return (
      <TweaksPanel>
        <TweakSection label="Atmosphere" />
        <TweakColor
          label="Theme"
          value={t.theme === 'vellum'
            ? ['#17140f','#f0e6d2','#b8862e']
            : t.theme === 'graphite'
              ? ['#0e0f10','#e8e9eb','#aab1bd']
              : ['#f1ece1','#1c1812','#7a1c1c']}
          options={[
            ['#17140f','#f0e6d2','#b8862e'],
            ['#0e0f10','#e8e9eb','#aab1bd'],
            ['#f1ece1','#1c1812','#7a1c1c'],
          ]}
          onChange={(palette) => {
            const map = {
              '#17140f': 'vellum',
              '#0e0f10': 'graphite',
              '#f1ece1': 'paper',
            };
            setTweak('theme', map[palette[0]] || 'vellum');
          }}
        />
        <TweakRadio
          label="Voice"
          value={t.voice}
          options={['cold','judicial','oracular']}
          onChange={(v) => setTweak('voice', v)}
        />
        <TweakRadio
          label="Density"
          value={t.density}
          options={['comfortable','dense']}
          onChange={(v) => setTweak('density', v)}
        />

        <TweakSection label="State demo" />
        <TweakSelect
          label="Day state"
          value={t.dayState}
          options={['onboarding','pre-checkin','mid-day','evening','all-complete','failed']}
          onChange={(v) => setTweak('dayState', v)}
        />
      </TweaksPanel>
    );
  }

  // ─── Canvas with phone + desktop side-by-side ──────────────────────────────
  function Canvas() {
    const { theme } = useApp();

    return (
      <DesignCanvas>
        <DCSection id="primary" title="The System · LifeOS" subtitle="One prototype, two surfaces. Shared state — try the Tweaks panel.">
          <DCArtboard id="phone" label="iOS · phone" width={402} height={874}>
            <PhoneArtboard />
          </DCArtboard>
          <DCArtboard id="desktop" label="Desktop · web app" width={1180} height={760}>
            <DesktopArtboard />
          </DCArtboard>
        </DCSection>
      </DesignCanvas>
    );
  }

  function PhoneArtboard() {
    const { theme } = useApp();
    // iOS frame status bar — picks light icons for dark themes, dark for paper
    const isDark = theme.bg !== '#f1ece1';
    return (
      <IOSDevice width={402} height={874} dark={isDark}>
        {/* Push content below the status bar. The IOSDevice already paints
            status bar absolutely, so we just add top padding. */}
        <div style={{ paddingTop: 54, height: '100%' }}>
          <LifeOSApp device="phone" />
        </div>
      </IOSDevice>
    );
  }

  function DesktopArtboard() {
    return (
      <ChromeWindow
        width={1180}
        height={760}
        tabs={[{ title: 'The System' }]}
        url="thesystem.app/directive"
      >
        <LifeOSApp device="desktop" />
      </ChromeWindow>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<Root />);
</script>
